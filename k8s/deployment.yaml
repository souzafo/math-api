apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-api
  labels:
    app: math-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: math-api
  template:
    metadata:
      labels:
        app: math-api
    spec:
      containers:
      - name: math-api
        image: math-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "25m"
            memory: "16Mi"
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5